<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f9f9f9;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        h2 { margin-top: 0; font-size: 18px; color: #4169E1; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        .setting {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: bold;
        }
        /* Big Toggle Switch CSS */
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #4169E1; }
        input:checked + .slider:before { transform: translateX(26px); }
        .hint { font-size: 12px; font-weight: normal; color: #666; margin-top: 4px; display: block; }
    </style>
</head>
<body>
    <h2>🇬🇧 NoAmericanisms</h2>

    <div class="setting">
        <div>
            Read British
            <span class="hint">Auto-fixes websites you visit</span>
        </div>
        <label class="switch"><input type="checkbox" id="toggleReading"><span class="slider"></span></label>
    </div>

    <div class="setting">
        <div>
            Type British
            <span class="hint">Underlines your typing mistakes</span>
        </div>
        <label class="switch"><input type="checkbox" id="toggleTyping"><span class="slider"></span></label>
    </div>

    <div class="setting">
        <div>
            Include Slang
            <span class="hint">Enforce standard & informal words</span>
        </div>
        <label class="switch"><input type="checkbox" id="toggleSlang"><span class="slider"></span></label>
    </div>

    <script src="popup.js"></script>
</body>
</html>
